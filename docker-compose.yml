# Local development stack: MongoDB + API. NOT for production (dev-only JWT secret below).
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development          # lets scripts/seed.js run; start:prod still syncs indexes
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/secure_notes
      JWT_SECRET: local-dev-only-secret-change-me-0123456789
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
